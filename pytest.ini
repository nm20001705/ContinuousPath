[pytest]
testpaths = tests
# The repo is a flat set of modules rather than a package, so the root
# has to be importable for `pytest` to work from a clean checkout.
pythonpath = .
filterwarnings =
    # trimesh divides by volume when computing a centre of mass, which is
    # NaN for the zero-volume debris the sliver tests deliberately build.
    ignore:invalid value encountered in divide:RuntimeWarning
